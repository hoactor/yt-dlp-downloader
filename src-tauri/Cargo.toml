[package]
name = "yt-dlp-downloader"
version = "0.1.0"
description = "yt-dlp GUI Downloader"
authors = ["honamgung"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
dirs = "5"
libc = "0.2"
tauri-plugin-dialog = "2.6.0"
